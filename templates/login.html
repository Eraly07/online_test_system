<!-- templates/login.html -->
{% extends "base.html" %}

{% block title %}Кіру{% endblock %}

{% block content %}
<div class="card" style="max-width: 450px; margin: 3rem auto;">
    <h2>Жүйеге кіру</h2>
    
    {% if error %}
        <div class="alert alert-error">{{ error }}</div>
    {% endif %}

    <form action="/login" method="post">
        <div class="form-group">
            <label for="username">Пайдаланушы аты</label>
            <input type="text" id="username" name="username" class="form-control" required>
        </div>
        <div class="form-group">
            <label for="password">Құпия сөз</label>
            <input type="password" id="password" name="password" class="form-control" required>
        </div>
        <button type="submit" class="btn">Кіру</button>
    </form>
    <p style="margin-top: 1rem; text-align: center; font-size: 0.9rem; color: var(--text-muted);">
        Жаңадан келдіңіз бе? <a href="/register" style="color: var(--primary-color);">Тіркеліңіз</a>
    </p>
</div>
{% endblock %}
